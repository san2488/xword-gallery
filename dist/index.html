<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="A date gallery for Seattle Times Mini and Modern Midi crosswords.">
  <title>Crossword Gallery</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1 class="brand">Crossword Gallery</h1>
      <div class="header-actions">
        <button id="today-button" class="primary-button" type="button">Play latest <span aria-hidden="true">↗</span></button>
        <button id="random-button" class="text-button" type="button">Surprise me <span aria-hidden="true">↗</span></button>
      </div>
    </header>

    <main>
      <section class="gallery-section" aria-label="Puzzle gallery">
        <div class="type-tabs" id="type-tabs" role="tablist" aria-label="Puzzle type"></div>
        <div class="jump-bar">
          <label for="month-picker">Jump to month</label>
          <input id="month-picker" type="month">
          <a id="archive-link" class="archive-link" href="https://www.seattletimes.com/games-crossword-midi-modern/" target="_blank" rel="noopener noreferrer" aria-label="Open the official Seattle Times archive for the selected puzzle type">Archive ↗</a>
        </div>
        <div id="gallery" class="gallery" aria-live="polite"></div>
        <div id="load-sentinel" class="load-sentinel" aria-live="polite">Scroll for older puzzles</div>
        <div class="gallery-footer"><p>Dates use patterns from shared PuzzleMe links. The publisher may not have a puzzle on every date.</p></div>
      </section>
    </main>
    <footer class="footer"><span>Crossword Gallery</span><span>An independent date browser. Puzzles open on The Seattle Times.</span></footer>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
